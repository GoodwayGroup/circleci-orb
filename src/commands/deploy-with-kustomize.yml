description: Deploy an image to kubernetes via kustomize

parameters:
  wait-for-rollout:
    type: boolean
    default: true
  post-deploy-steps:
    type: steps
    default: []
  cluster-name:
    type: string
  image-name:
    type: string
  kustomize-path:
    type: string
  namespace:
    type: string
  deployment-resource-name:
    default: deployment/app
    type: string
  kustomize-image-name:
    type: string
    default: app
    description: Kustomize images[].name to match when updating an existing images section.
  notification-channel:
    type: string
    default:

steps:
  - checkout
  - determine-docker-tag

  - aws-cli/setup:
      role-arn: $IAM_ROLE_ARN
      aws-region: AWS_REGION
  - aws-eks/update-kubeconfig-with-authenticator:
      cluster-name: << parameters.cluster-name >>
      install-aws-cli: false
      install-kubectl: true
      aws-region: $AWS_REGION

  - run:
      name: 'Set deployment image tag'
      environment:
        KUSTOMIZE_PATH: << parameters.kustomize-path >>
        KUSTOMIZE_IMAGE_NAME: << parameters.kustomize-image-name >>
        IMAGE_NAME: << parameters.image-name >>
      command: <<include(scripts/set-kustomize-image.sh)>>

  # Conditionally wait for rollout to complete
  - when:
      condition:
        equal: [<< parameters.wait-for-rollout >>, true]
      steps:
        - kubernetes/create_or_update_resource:
            namespace: << parameters.namespace >>
            kustomize: true
            get_rollout_status: true
            watch_rollout_status: true
            resource_file_path: <<parameters.kustomize-path>>
            resource_name: <<parameters.deployment-resource-name>> # Name of the deployment to be used for tracking rollout status

  - when:
      condition:
        equal: [<< parameters.wait-for-rollout >>, false]
      steps:
        - kubernetes/create_or_update_resource:
            namespace: << parameters.namespace >>
            kustomize: true
            get_rollout_status: true
            watch_rollout_status: false
            resource_file_path: <<parameters.kustomize-path>>
            resource_name: <<parameters.deployment-resource-name>> # Name of the deployment to be used for tracking rollout status

  - steps: << parameters.post-deploy-steps >>


  # Notify deploy, Using basic slack notification until a custom one can be created.
  - when:
      condition: << parameters.notification-channel >>
      steps:
        - slack/notify:
            channel: << parameters.notification-channel >>
            event: pass
            template: basic_success_1
        - slack/notify:
            channel: << parameters.notification-channel >>
            event: fail
            template: basic_fail_1
