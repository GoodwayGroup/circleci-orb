description: Deploy an image to kubernetes via kustomize

parameters:
  wait-for-rollout:
    type: boolean
    default: true
  post-deploy-steps:
    type: steps
    default: []
  cluster-name:
    type: string
  image-name:
    type: string
  kustomize-path:
    type: string
  namespace:
    type: string
  deployment-resource-name:
    default: deployment/app
    type: string
  notification-channel:
    type: string
    default:
  github-pat-env:
    type: env_var_name
    default: GITHUB_PAT
    description: |
      Name of a CircleCI env var containing a GitHub PAT.
      When set and non-empty, the install script is downloaded with authentication.
      When unset or empty, downloads without auth.

steps:
  - checkout
  - determine-docker-tag

  - aws-cli/setup:
      role-arn: $IAM_ROLE_ARN
      aws-region: AWS_REGION
  - run:
      name: 'Install Kustomize'
      command: |
        INSTALL_URL="https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh"
        PAT="${<< parameters.github-pat-env >>}"

        if [ -n "$PAT" ]; then
          echo "Downloading install_kustomize.sh with GitHub authentication (<< parameters.github-pat-env >>)"
          curl -sf -H "Authorization: Bearer ${PAT}" "$INSTALL_URL" | bash
        else
          echo "Downloading install_kustomize.sh without authentication (<< parameters.github-pat-env >> not set)"
          curl -sf "$INSTALL_URL" | bash
        fi
        sudo mv kustomize /usr/local/bin

  - run:
      name: 'Build Deployment Manifest'
      command: |
        cd <<parameters.kustomize-path>>
        kustomize edit set image <<parameters.image-name>>:$DOCKER_TAG
        kustomize build . > deploy-manifest.yaml
        cd
  - aws-eks/update-kubeconfig-with-authenticator:
      cluster-name: << parameters.cluster-name >>
      install-aws-cli: false
      install-kubectl: true
      aws-region: $AWS_REGION

  # Conditionally wait for rollout to complete
  - when:
      condition:
        equal: [<< parameters.wait-for-rollout >>, true]
      steps:
        - kubernetes/create-or-update-resource:
            namespace: << parameters.namespace >>
            get-rollout-status: true
            watch-rollout-status: true
            resource-file-path: <<parameters.kustomize-path>>/deploy-manifest.yaml
            resource-name: <<parameters.deployment-resource-name>> # Name of the deployment to be used for tracking rollout status

  - when:
      condition:
        equal: [<< parameters.wait-for-rollout >>, false]
      steps:
        - kubernetes/create-or-update-resource:
            namespace: << parameters.namespace >>
            get-rollout-status: true
            watch-rollout-status: false
            resource-file-path: <<parameters.kustomize-path>>/deploy-manifest.yaml
            resource-name: <<parameters.deployment-resource-name>> # Name of the deployment to be used for tracking rollout status

  - steps: << parameters.post-deploy-steps >>


  # Notify deploy, Using basic slack notification until a custom one can be created.
  - when:
      condition: << parameters.notification-channel >>
      steps:
        - slack/notify:
            channel: << parameters.notification-channel >>
            event: pass
            template: basic_success_1
        - slack/notify:
            channel: << parameters.notification-channel >>
            event: fail
            template: basic_fail_1
