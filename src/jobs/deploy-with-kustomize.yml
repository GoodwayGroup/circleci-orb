description: Deploy an image to kubernetes from build images hosted in ecr

parameters:
  environment:
    type: string
  app-name:
    type: string
  executor-tag:
    type: string
    default: '3.10'
  executor-resource-class:
    default: small
    description: Configure the executor resource class
    enum:
      - small
      - medium
      - medium+
      - large
      - xlarge
      - 2xlarge
      - 2xlarge+
    type: enum
  kube-path:
    type: string
    default: .kube/
  wait-for-rollout:
    type: boolean
    default: false
  post-deploy-steps:
    type: steps
    default: []
  deployment-resource-name:
    default: deployment/app
    type: string
  notification-channel:
    type: string
    default:
  cluster-name:
    type: string
    default: ''
  github-pat-env:
    type: env_var_name
    default: GITHUB_PAT
    description: |
      Name of a CircleCI env var containing a GitHub PAT for downloading install_kustomize.sh.

executor:
  name: python-default
  tag: << parameters.executor-tag >>
  resource_class: << parameters.executor-resource-class >>

steps:
  - unless:
      condition: << parameters.cluster-name >>
      steps:
        - deploy-with-kustomize:
            cluster-name: goodway-<< parameters.environment >>
            image-name: $AWS_ECR_REGISTRY_URL/microservice/<< parameters.app-name >>
            kustomize-path: << parameters.kube-path >>/overlays/<< parameters.environment >>
            namespace: << parameters.app-name >>-<< parameters.environment >>
            wait-for-rollout: << parameters.wait-for-rollout >>
            post-deploy-steps: << parameters.post-deploy-steps >>
            deployment-resource-name: << parameters.deployment-resource-name >>
            notification-channel: << parameters.notification-channel >>
            github-pat-env: << parameters.github-pat-env >>
  - when:
      condition: << parameters.cluster-name >>
      steps:
        - deploy-with-kustomize:
            cluster-name: << parameters.cluster-name >>
            image-name: $AWS_ECR_REGISTRY_URL/microservice/<< parameters.app-name >>
            kustomize-path: << parameters.kube-path >>/overlays/<< parameters.environment >>
            namespace: << parameters.app-name >>-<< parameters.environment >>
            wait-for-rollout: << parameters.wait-for-rollout >>
            post-deploy-steps: << parameters.post-deploy-steps >>
            deployment-resource-name: << parameters.deployment-resource-name >>
            notification-channel: << parameters.notification-channel >>
            github-pat-env: << parameters.github-pat-env >>
